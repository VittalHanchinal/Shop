spring.application.name=kalatailering

# PostgreSQL configuration (Render Cloud)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/kalatailering_db
spring.datasource.username=kalatailering
spring.datasource.password=Vittal@123

# JPA + Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# (Optional) connection pool tuning
spring.datasource.initialization-mode=always
spring.datasource.hikari.maximum-pool-size=5
